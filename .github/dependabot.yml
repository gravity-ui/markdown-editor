# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Note: Dependabot security updates are enabled automatically by GitHub
# when dependabot.yml exists. Security updates create PRs for vulnerabilities
# independently of the regular update schedule above.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(github)"
    groups:
      github-actions:
        patterns:
          - "actions/*"

  # npm — pnpm workspace. The shared pnpm-lock.yaml is updated only from the workspace root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 15
      exclude:
        - "@diplodoc/*"
        - "@gravity-ui/*"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      babel:
        patterns:
          - "@babel/*"
          - "babel-*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
      prosemirror:
        patterns:
          - "orderedmap"
          - "prosemirror-*"
      codemirror:
        patterns:
          - "@lezer/*"
          - "@codemirror/*"
          - "codemirror"
      gulp:
        patterns:
          - "gulp"
          - "gulp-*"
          - "@types/gulp*"
          - "@gravity-ui/gulp-utils"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Names instead of @diplodoc/* and @gravity-ui/*: packages from these scopes in infra/* stay updatable.
      - dependency-name: "@diplodoc/*-extension"
      - dependency-name: "@diplodoc/themes"
      - dependency-name: "@diplodoc/transform"
      - dependency-name: "@diplodoc/utils"
      - dependency-name: "@gravity-ui/components"
      - dependency-name: "@gravity-ui/i18n"
      - dependency-name: "@gravity-ui/icons"
      - dependency-name: "@gravity-ui/page-constructor"
      - dependency-name: "@gravity-ui/uikit"
