name: PR Visual Tests

on:
  pull_request:

jobs:
  visual_tests:
    name: Visual Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm run ci:deps

      - name: Run Visual Tests
        run: pnpm run ci:test:visual
        env:
          CI: 'true'

      - name: Generate Screenshot Diff
        if: success() || failure()
        working-directory: demo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          snapshots=tests/visual-tests/__snapshots__
          report=playwright-report/snapshot-diff
          mkdir -p "$report/expected" "$report/actual"
          save() { mkdir -p "$(dirname "$3")"; git show "$1:$2" > "$3" 2>/dev/null || rm "$3"; }
          git diff -z --name-only --no-renames HEAD^1 HEAD -- "$snapshots" | while IFS= read -r -d '' file; do
            save HEAD^1 "$file" "$report/expected/${file#demo/$snapshots/}"
            save HEAD "$file" "$report/actual/${file#demo/$snapshots/}"
          done
          cd "$report" && pnpm dlx reg-cli@0.19.0-rc3 actual expected diff -R index.html -I -M 0.1

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ./demo/playwright-report
          retention-days: 1

      - name: Save PR ID
        if: always()
        run: |
          pr="${{ github.event.pull_request.number }}"
          echo $pr > ./pr-id.txt
        shell: bash

      - name: Create PR Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr
          path: ./pr-id.txt
